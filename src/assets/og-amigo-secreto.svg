<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Capa de compartilhamento do Amigo Secreto</title>
  <desc id="desc">Composição retrô em amarelo, verde, vermelho, branco e preto com o nome Amigo Secreto e um presente em pixel art.</desc>
  <defs>
    <pattern id="pixel-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#151515" stroke-opacity="0.055" stroke-width="2" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#fef3c7" />
  <rect width="1200" height="630" fill="url(#pixel-grid)" />

  <rect x="70" y="74" width="700" height="506" fill="#151515" />
  <rect x="54" y="58" width="700" height="506" fill="#ffffff" stroke="#151515" stroke-width="6" />

  <rect x="92" y="98" width="420" height="54" fill="#dcfce7" stroke="#151515" stroke-width="4" />
  <text x="302" y="133" text-anchor="middle" fill="#151515" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="900" letter-spacing="1.5">SORTEIO SEM COMPLICAÇÃO</text>

  <text x="88" y="272" fill="#151515" font-family="Consolas, 'Courier New', monospace" font-size="104" font-weight="900" letter-spacing="-8">AMIGO</text>
  <text x="84" y="382" fill="#dc2626" font-family="Consolas, 'Courier New', monospace" font-size="104" font-weight="900" letter-spacing="-8">SECRETO</text>

  <rect x="92" y="422" width="610" height="4" fill="#151515" />
  <text x="92" y="470" fill="#151515" font-family="Consolas, 'Courier New', monospace" font-size="25" font-weight="700">CRIE O GRUPO. CONVIDE A TURMA.</text>
  <text x="92" y="510" fill="#151515" font-family="Consolas, 'Courier New', monospace" font-size="25" font-weight="700">DEIXE O SORTEIO POR NOSSA CONTA.</text>

  <rect x="806" y="54" width="350" height="550" fill="#151515" />
  <rect x="790" y="38" width="350" height="550" fill="#14532d" stroke="#151515" stroke-width="6" />
  <rect x="820" y="70" width="290" height="458" fill="#ffffff" stroke="#151515" stroke-width="5" stroke-dasharray="14 10" />

  <g fill="#facc15">
    <rect x="848" y="103" width="10" height="34" />
    <rect x="836" y="115" width="34" height="10" />
    <rect x="1072" y="132" width="8" height="28" />
    <rect x="1062" y="142" width="28" height="8" />
    <rect x="854" y="452" width="8" height="28" />
    <rect x="844" y="462" width="28" height="8" />
    <rect x="1070" y="430" width="10" height="34" />
    <rect x="1058" y="442" width="34" height="10" />
  </g>

  <image x="855" y="142" width="220" height="254" image-rendering="pixelated" xlink:href="presente-pixel-art.svg" href="presente-pixel-art.svg" />

  <rect x="835" y="490" width="260" height="66" fill="#dc2626" stroke="#151515" stroke-width="5" />
  <text x="965" y="532" text-anchor="middle" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="900" letter-spacing="2">QUEM SERÁ?</text>

  <rect x="20" y="20" width="18" height="18" fill="#dc2626" stroke="#151515" stroke-width="3" />
  <rect x="1162" y="592" width="18" height="18" fill="#facc15" stroke="#151515" stroke-width="3" />
</svg>
